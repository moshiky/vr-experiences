<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR experiences</title>
<style>
:root{--bg:#0f1113;--fg:#f0ece4;--muted:#a8a398;--accent:#dcbd8c;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left,0px));direction:rtl}
h1{font-size:28px;margin:0 0 6px}p{color:var(--muted);margin:0 0 28px}
a.card{display:block;padding:18px 20px;border:1px solid rgba(236,230,218,.16);border-radius:14px;color:var(--fg);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card b{display:block;font-size:19px}a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>VR experiences</h1>
<p>סיורים תלת־ממדיים שעובדים בדפדפן, גם במשקפת Quest.</p>
<a class="card" href="family-house-1/"><b>בית משפחה 1</b><span>סיור בבית בשתי קומות</span></a>
</main>
</body>
</html>
